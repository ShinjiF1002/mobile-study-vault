<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1715">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Private Study Library</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">PRIVATE · ENCRYPTED</p>
      <h1>Study Library</h1>
      <p class="lede">個人用の暗号化された学習ライブラリです。</p>
    </header>

    <section id="unlock-panel" class="panel">
      <form id="unlock-form">
        <label for="password">アクセスパスワード</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">解除</button>
        </div>
        <p id="unlock-status" class="status" aria-live="polite">内容は端末内で復号されます。</p>
      </form>
    </section>

    <section id="library" class="library" hidden>
      <div class="library-head">
        <div>
          <p class="eyebrow">YOUR LIBRARY</p>
          <h2>読む資料を選択</h2>
        </div>
        <button id="lock-button" class="quiet-button" type="button">ロック</button>
      </div>
      <div id="document-list" class="document-list"></div>
      <p class="offline-note">一度開いた資料は、この端末のブラウザキャッシュから再読できます。</p>
    </section>
  </main>

  <dialog id="reader">
    <div class="reader-bar">
      <strong id="reader-title"></strong>
      <button id="reader-close" type="button">閉じる</button>
    </div>
    <iframe id="reader-frame" title="Document reader"></iframe>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
